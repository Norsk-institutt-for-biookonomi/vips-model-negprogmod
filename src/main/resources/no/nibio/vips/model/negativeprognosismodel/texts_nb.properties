name=Negativprognosemodell
description=<h1>Negativprognosen</h1>\n<p>Fra en bestemt startdato (50% oppspiring av hovedsorten i omr&aring;det) akkumuleres daglige risikoverdier basert p&aring; v&aelig;rdata (temperatur, relativ luftfuktighet og nedb&oslash;r). Risikoverdien er en sum av v&aelig;rets innvirkning p&aring; t&oslash;rr&aring;tesoppens spiring/infeksjon, sporulering og mycelvekst. Det korrigeres for t&oslash;rkehemming av disse prosessene. Etter at den akkumulerte risikoverdien har n&aring;dd en viss grense (150) er det fare for prim&aelig;rangrep dersom man f&aring;r en dag h&oslash;y risiko. Modellen vil v&aelig;re et supplement til kriteriet "radlukking" for bestemmelse av f&oslash;rste spr&oslash;yttidspunkt.</p>\n<h2>Tolking av varsel</h2>\n<h3>F&oslash;rste spr&oslash;yting</h3>\n<p>Det er normalt ikke n&oslash;dvendig med t&oslash;rr&aring;tespr&oslash;yting f&oslash;r radlukking. Ved langvarig t&oslash;rr&aring;tev&aelig;r kan det i omr&aring;der med tidligpotetdyrking og/eller i &aring;r med mye prim&aelig;rsmitte v&aelig;re n&oslash;dvendig &aring; behandle f&oslash;r dette tidspunkt. Dersom de akkumulerte risikoverdiene i negativprognosemodellen n&aring;r 150 tidligere, b&oslash;r en starte spr&oslash;ytingen ved f&oslash;rste varsel etter "N&aelig;rstadmodellen" etter dette tidspunktet.</p>\n<p>I &aring;r med lange perioder med v&aring;t jord i juni har det v&aelig;rt funn av t&oslash;rr&aring;te tidligere enn det Negativprognosemodellen tilsier. Sammenhold av tidspunktet for tidlige t&oslash;rr&aring;tefunn i Norge de ti siste &aring;rene (2003-2012), og t&oslash;rr&aring;terisikoen m&aring;lt med N&aelig;rstad modellen, viser at det ikke har blitt funnet t&oslash;rr&aring;te (i felt uten dekking) f&oslash;r det har v&aelig;rt minst to perioder med h&oslash;y t&oslash;rr&aring;terisiko (dager med flere timer med t&oslash;rr&aring;terisiko over 10) i kombinasjon med v&aring;t jord (to uker med vannmetning). Basert p&aring; dette blir tilr&aring;dningen n&aring; &aring; begynne t&oslash;rr&aring;tespr&oslash;ytingen i felter med v&aring;t jord dagen f&oslash;r den andre perioden med h&oslash;ye t&oslash;rr&aring;terisikoverdier fra N&aelig;rstad modellen etter spiring.</p>\n<h2>Varslingssesong &ndash; oppstart og avslutning av varsel</h2>\n<p>Starttidspunkt: Individuelt for hver enkelt stasjon</p>\n<p>Sluttidspunkt: 15/9</p>\n<h2>Utpr&oslash;ving og validering av modellen</h2>\n<p>Denne modellen er utpr&oslash;vd i flere land og er basis for varslingssystemer mot t&oslash;rr&aring;te i blant annet USA (NegFry).</p>\n<h2>Referanser</h2>\n<p>Ullrich J. &amp; H. Schr&ouml;dter 1966. Das Problem der Vorhersage des Auftretens der Kartoffel krautf&auml;ule (Phytophthora infestans) und die M&ouml;glichkeit seiner L&ouml;sung durch eine &ldquo;Negativprognose&rdquo;. Nachrichtenblatt Deutsch. Pflanzenschutzdienst (Braunschweig) 18, 33-40</p>\n<p>Kontaktperson: <a href="mailto:haavard.eikemo@nibio.no">H&aring;vard Eikemo</a></p>\n<p>Lenke til mer informasjon om potett&oslash;rr&aring;te: <a href="https://www.plantevernleksikonet.no/l/oppslag/281/">https://www.plantevernleksikonet.no/l/oppslag/281/</a></p>
statusInterpretation=N\u00e5r akkumulert risiko < 120 settes varselsymbolet til gr\u00f8nt (ingen fare), og n\u00e5r den passerer 120 settes det til gult (mulig fare). N\u00e5r akkumulert risiko passerer 150 settes varselsymbolet til r\u00f8dt (fare), og forblir r\u00f8dt frem til 200, da modellen avsluttes og fargen settes til gr\u00e5.\n\nNegativprognosen er f\u00f8rst og fremst et hjelpemiddel for beregning av f\u00f8rste spr\u00f8ytetidspunkt. Selv etter modellen er avsluttet vil daglige bidrag og akkumulert risiko vises i bakgrunnen, men vises ikke med varselsymbol. Som hjelp til n\u00e5r tiltak skal settes inn mot t\u00f8rr\u00e5te i potet skal N\u00e6rstads modell benyttes.
